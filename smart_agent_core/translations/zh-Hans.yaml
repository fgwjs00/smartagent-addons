configuration:
  auth_token:
    name: 家庭业主访问令牌
    description: 供中控屏、家庭助理集成和 SmartAgent 网关识别同一家庭业主；家庭版只使用这一份业主令牌。
  ha_time_zone:
    name: 家庭时区
    description: 用于解析家庭助理返回的本地时间；中国大陆环境建议保持亚洲上海时区。
  log_level:
    name: 日志详细程度
    description: 平时保持信息级别，仅在排查故障时临时提高日志详细程度。
  license_key:
    name: 产品授权码
    description: 企业版或商业授权码；留空时按照家庭免费版能力运行。
  deploy_name:
    name: 家庭名称
    description: 当前 SmartAgent 安装点的显示名称，用于区分不同家庭或测试环境。
  remote_access_enabled:
    name: 启用远程访问
    description: 关闭时不会建立到云端的远程控制连接；只有家庭业主明确开启后才允许配对。
  remote_cloud_url:
    name: 远程服务地址
    description: SmartAgent 远程服务的安全地址；家庭正式环境通常保持默认值。
  remote_gateway_label:
    name: 远程网关名称
    description: 家庭业主在远程设备列表中看到的本机名称，不要填写密码或家庭隐私信息。
  steward_base_url:
    name: AI 管家服务地址
    description: 用于连接同一家庭的 AI 管家；通常留空使用默认地址，本地安装时填写对应的内部服务地址。
  steward_device_delegation_enabled:
    name: AI 管家设备控制
    description: 允许 AI 管家将设备请求交给 SmartAgent 规划和执行；两端版本匹配、服务连接完成后开启。
network:
  8234/tcp: SmartAgent 网关 / 管理界面
